name: register-artifact-from-github                                                                                                                                                                                                               
on:                                                                                                                                                                                                                                               
    push                                                                                                                                                                                                                                            
jobs:                                                                                                                                                                                                                                             
    register-artifact:   
      name: register artifact
      runs-on: ubuntu-latest
      permissions:                                                                                                                                                                                                                                  
        id-token: write                                                                                                                                                                                                                             
        contents: read                                                                                                                                                                                                                              
      steps:                                                                                                                                                                                                                                        
        - name: Checkout code                                                                                                                                                                                                                       
          uses: actions/checkout@v6                                                                                                                                                                                                                 
        - name: Build                                                                                                                                                                                                                               
          run: |                                                                                                                                                                                                                                    
            sleep 10                                                                                                                                                                                                                                
        - id: register-build-artifact
#          name: Register build artifact
          uses: cloudbees-io-gha/register-build-artifact@v3
          with:                                                                                                                                                                                                                                     
            cloudbees-url: "https://api.saas-preprod.beescloud.com"                                                                                                                                                                                 
            name: pan-artifact-gha-8-may
            url: "https://example.com/pan-artifact-gha-8-may/1.0.0"
            version: 1.0.0                                                                                                                                                                                                                          
        - name: Print artifact id                                                                                                                                                                                                                   
          run: |                                                                                                                                                                                                                                    
            echo '${{ steps.register-build-artifact.outputs.cbp_artifact_id }}'                                                                                                                                                                     
        - id: register-deployed-artifact
#          name: Register deployed artifact
          uses: cloudbees-io-gha/register-deployed-artifact@v0
#          uses: docker://public.ecr.aws/cloudbees/actions/gha-register-deployed-artifact:main-8d819ee6c37734d240bc3e399c7515d85aa14f76
          env:
            CLOUDBEES_API_URL: "https://api.saas-preprod.beescloud.com"
#            TARGET_ENVIRONMENT: "PANPREPRODTEST"
            TARGET_ENVIRONMENT: "PREPROD"
            ARTIFACT_ID: ${{ steps.register-build-artifact.outputs.cbp_artifact_id }}
            DEPLOYMENT_LABELS: "test"