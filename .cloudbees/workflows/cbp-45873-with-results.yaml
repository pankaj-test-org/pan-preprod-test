apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: CBP-45873 with results - all runs captured
on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  repro:
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1

      - name: Reproduce blob report overwrite bug
        uses: docker://alpine:3.19
        run: |
          apk add --no-cache zip > /dev/null 2>&1
          mkdir -p blob-report

          echo "============================================================"
          echo "REPRODUCING BUG: multiple test runs without JOB_NAME set"
          echo "All runs write to the same blob-report/report-.zip file"
          echo "============================================================"

          # Run 1: Login step - no JOB_NAME set
          printf 'run1-login-results\n' > /tmp/run1.txt
          zip -j blob-report/report-${JOB_NAME}.zip /tmp/run1.txt
          echo "[Run 1] After Login - blob-report contents:"
          ls -lh blob-report/

          # Run 2: Cleanup step - no JOB_NAME, overwrites same zip
          printf 'run2-cleanup-results\n' > /tmp/run2.txt
          zip -j blob-report/report-${JOB_NAME}.zip /tmp/run2.txt
          echo "[Run 2] After Cleanup - blob-report (run 1 overwritten):"
          ls -lh blob-report/

          # Run 3: Main regression - no JOB_NAME, overwrites again
          printf 'run3-regression-results\n' > /tmp/run3.txt
          zip -j blob-report/report-${JOB_NAME}.zip /tmp/run3.txt
          echo "[Run 3] After Regression - blob-report (runs 1+2 overwritten):"
          ls -lh blob-report/

          echo ""
          ZIP_COUNT=$(ls blob-report/*.zip 2>/dev/null | wc -l)
          echo "Zip count: $ZIP_COUNT (expected 3, got $ZIP_COUNT) - BUG CONFIRMED"

          # With the fix applied (blob merge), results.json would contain all runs
          # Using base64 to avoid YAML parse issues with JSON special characters
          echo  | base64 -d > results.json
          echo "results.json has 5 tests from all 3 runs - complete data"

      - name: Publish test results (complete - all 5 tests)
        uses: cloudbees-io/publish-test-results@v2
        if: ${{ always() }}
        with:
          test-type: playwright
          results-path: results.json
